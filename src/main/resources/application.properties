spring.application.name=bankProductCreation
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB
spring.mvc.problemdetails.enabled=true
app.data-dir=${APP_DATA_DIR:./data}
app.import-legacy-state=${APP_IMPORT_LEGACY_STATE:true}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.eimzo.mode=demo
app.host.mode=demo
app.document.mode=${APP_DOCUMENT_MODE:demo}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bank_product}
spring.datasource.username=${DB_USERNAME:bank_product_owner}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
